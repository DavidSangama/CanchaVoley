spring.application.name=backend

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_schema=renta_cancha

server.port=${PORT:6767}
frontend.url=${FRONTEND_URL:http://localhost:5173}

spring.mail.host=${GMAIL_SMTP_HOST:smtp.gmail.com}
spring.mail.port=${GMAIL_SMTP_PORT:587}
spring.mail.username=${GMAIL_SMTP_USERNAME:}
spring.mail.password=${GMAIL_SMTP_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000